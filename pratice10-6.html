<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setInterval()/clearInterval()</title>
    <script>
        let div;
        let now;
        let timer;
        function startClock(){
            div = document.getElementById('div');
            now = new Date();
            timer = setInterval('showTime();', 1000);
        }

        function showTime(){
            now = new Date();
            div.innerHTML = now.toLocaleTimeString();
        }

        function stop_start_Clock(){
            if(timer != null){
                clearInterval(timer);
                timer = null;
                div.style.color = "gray";
            }
            else{
                startClock();
                div.innerHTML = now.toLocaleTimeString();
                div.style.color = "black";
            }
            
            
        }
        </script>
</head>
<body onload="startClock();">
    <h3>div 태그에 시계 만들기</h3>
    <hr>
    <div id="div" onclick="stop_start_Clock();" style="width: 120px; background-color:rgb(210, 235, 245); border: 2px solid gray;"></div>
</body>
</html>
